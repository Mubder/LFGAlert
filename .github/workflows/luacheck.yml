name: Luacheck

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install luacheck
      # Lint only our files: luarocks installs its own tree (.luarocks/) into
      # the workspace, and `luacheck .` would lint hundreds of third-party
      # toolchain files (why this job always failed before). luac -p catches
      # syntax errors even when lint is clean.
      - run: luac -p Core.lua LogFrame.lua Options.lua Locales/enUS.lua
      - run: luacheck Core.lua LogFrame.lua Options.lua Locales/enUS.lua
